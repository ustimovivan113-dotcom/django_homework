<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}Редактировать{% else %}Создать{% endif %} продукт</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>{% if object %}Редактировать{% else %}Создать{% endif %} продукт</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="mb-3">
            <label class="form-label">Название</label>
            {{ form.name }}
            {{ form.name.errors }}
        </div>
        <div class="mb-3">
            <label class="form-label">Описание</label>
            {{ form.description }}
            {{ form.description.errors }}
        </div>
        <div class="mb-3">
            <label class="form-label">Цена</label>
            {{ form.price }}
            {{ form.price.errors }}
        </div>
        <div class="form-check mb-3">
            {{ form.is_active }}
            <label class="form-check-label" for="{{ form.is_active.id_for_label }}">Активен</label>
            {{ form.is_active.errors }}
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</body>
</html>
