<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ object.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>{{ object.name }}</h2>
    <p><strong>Описание:</strong> {{ object.description }}</p>
    <p><strong>Цена:</strong> {{ object.price }}</p>
    <p><strong>Активен:</strong> {% if object.is_active %}Да{% else %}Нет{% endif %}</p>
    <a href="{% url 'product_list' %}" class="btn btn-secondary">Назад</a>
</body>
</html>
